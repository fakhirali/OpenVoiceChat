[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvoicechat"
version = "0.4.0"
description = "A small local voice runtime for Python: Parakeet STT, Kokoro TTS, Silero VAD, many calls on one GPU."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Finity Alpha", email = "fakhir.ali@finityalpha.com" }]
keywords = ["voice", "speech", "stt", "tts", "parakeet", "kokoro", "local", "telephony"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.26",
    "onnxruntime-gpu>=1.18; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "onnxruntime-gpu>=1.18; platform_system == 'Windows' and platform_machine == 'AMD64'",
    "onnxruntime>=1.18; platform_system == 'Darwin'",
    "onnxruntime>=1.18; platform_system == 'Linux' and platform_machine != 'x86_64'",
    "onnxruntime>=1.18; platform_system == 'Windows' and platform_machine != 'AMD64'",
    "openai>=1.40",
    "pysbd>=0.3.4",
    "python-dotenv>=1.0",
    "soxr>=0.4",
]

[project.optional-dependencies]
# Microphone and speaker I/O.
local = ["sounddevice>=0.5"]
# Local Parakeet STT and Kokoro TTS.
models = [
    "torch>=2.4",
    "kokoro>=0.9.2",
    "soundfile>=0.12",
    "onnx-asr[hub]>=0.12",
]
# Twilio Media Streams transport (coming in 0.4).
twilio = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12"]
# Daily meeting transport (currently one process per meeting; shared runtime is next).
daily = ["daily-python>=0.14", "fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
ovc = "openvoicechat.cli:main"

[project.urls]
Homepage = "https://github.com/fakhirali/OpenVoiceChat"
Issues = "https://github.com/fakhirali/OpenVoiceChat/issues"

[tool.setuptools.packages.find]
include = ["openvoicechat*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
